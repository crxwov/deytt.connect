<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
      touch-action: none;
    }
    #galaxyCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: #000000;
    }
  </style>
</head>
<body>
<canvas id="galaxyCanvas"></canvas>
<script>
(function() {
  const canvas = document.getElementById('galaxyCanvas');
  const gl = canvas.getContext('webgl2', {
    alpha: false,
    antialias: false,
    depth: false,
    stencil: false,
    powerPreference: 'high-performance'
  });
  if (!gl) return;

  const MAX_LAYERS = 8;
  const MAX_COLORS = 4;

  const VERTEX = `#version 300 es
  in vec2 aPosition;
  void main() {
    gl_Position = vec4(aPosition, 0.0, 1.0);
  }`;

  const FRAGMENT = `#version 300 es
  precision highp float;
  precision highp int;
  uniform float uTime;
  uniform vec2 uResolution;
  uniform vec2 uFocal;
  uniform vec2 uRotation;
  uniform float uGloss;
  uniform float uDepth;
  uniform float uDensity;
  uniform float uHueShift;
  uniform float uSpeed;
  uniform vec2 uMouse;
  uniform float uStarGlow;
  uniform float uFlareGain;
  uniform float uSquash;
  uniform float uSaturation;
  uniform float uMouseRepulsion;
  uniform float uTwinkleIntensity;
  uniform float uRotationAngle;
  uniform float uRepulsionStrength;
  uniform float uMouseActiveFactor;
  uniform float uAutoCenterRepulsion;
  uniform int uLayers;
  uniform vec3 uColors[4];
  uniform int uColorCount;
  uniform float uWarp;
  uniform float uReveal;
  uniform float uMode;
  uniform vec3 uBackground;
  uniform float uOpacity;
  out vec4 outColor;

  #define STAR_COLOR_CUTOFF 0.2
  #define MAT45 mat2(0.7071, -0.7071, 0.7071, 0.7071)
  #define PERIOD 3.0

  float Hash21(vec2 p) {
    p = fract(p * vec2(123.34, 456.21));
    p += dot(p, p + 45.32);
    return fract(p.x * p.y);
  }

  float tri(float x) {
    return abs(fract(x) * 2.0 - 1.0);
  }

  float tris(float x) {
    float t = fract(x);
    return 1.0 - smoothstep(0.0, 1.0, abs(2.0 * t - 1.0));
  }

  float trisn(float x) {
    float t = fract(x);
    return 2.0 * (1.0 - smoothstep(0.0, 1.0, abs(2.0 * t - 1.0))) - 1.0;
  }

  vec3 hsv2rgb(vec3 c) {
    vec4 K = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
    vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
    return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
  }

  float Star(vec2 uv, float flare, vec2 radial, float invReach) {
    float d = length(uv);
    float m = uStarGlow / max(d, 0.0001);
    float rays = smoothstep(0.0, 1.0, 1.0 - abs(uv.x * uv.y * 1000.0));
    m += rays * flare * uFlareGain;
    uv *= MAT45;
    rays = smoothstep(0.0, 1.0, 1.0 - abs(uv.x * uv.y * 1000.0));
    m += rays * 0.3 * flare * uFlareGain;
    m *= smoothstep(1.0, 0.2, d * invReach);
    return m;
  }

  vec3 StarLayer(vec2 uv, vec2 radial, vec2 repelAt, float pushCells, float spread) {
    vec3 col = vec3(0.0);
    vec2 gv = fract(uv) - 0.5;
    vec2 id = floor(uv);
    for (int y = -1; y <= 1; y++) {
      for (int x = -1; x <= 1; x++) {
        vec2 offset = vec2(float(x), float(y));
        vec2 si = id + offset;
        float seed = Hash21(si);
        float size = fract(seed * 345.32);
        float glossLocal = tri(uGloss / (PERIOD * seed + 1.0));
        float flareSize = smoothstep(0.9, 1.0, size) * glossLocal;

        float red = smoothstep(STAR_COLOR_CUTOFF, 1.0, Hash21(si + 1.0)) + STAR_COLOR_CUTOFF;
        float blu = smoothstep(STAR_COLOR_CUTOFF, 1.0, Hash21(si + 3.0)) + STAR_COLOR_CUTOFF;
        float grn = min(red, blu) * seed;
        vec3 base = vec3(red, grn, blu);
        float hue = atan(base.g - base.r, base.b - base.r) / (2.0 * 3.14159) + 0.5;
        hue = fract(hue + uHueShift / 360.0);
        float sat = length(base - vec3(dot(base, vec3(0.299, 0.587, 0.114)))) * uSaturation;
        float val = max(max(base.r, base.g), base.b);
        base = hsv2rgb(vec3(hue, sat, val));

        vec2 pad = vec2(tris(seed * 34.0 + uTime * uSpeed / 10.0), tris(seed * 38.0 + uTime * uSpeed / 30.0)) - 0.5;
        float invReach = 1.0;
        float star = Star(gv - offset - pad, flareSize, radial, invReach);
        float twinkle = trisn(uTime * uSpeed + seed * 6.2831) * 0.5 + 1.0;
        twinkle = mix(1.0, twinkle, uTwinkleIntensity);
        col += star * twinkle * size * base;
      }
    }
    return col;
  }

  void main() {
    vec2 focalPx = uFocal * uResolution;
    vec2 uv = (gl_FragCoord.xy - focalPx) / uResolution.y;

    vec2 radial = length(uv) > 0.0001 ? normalize(uv) : vec2(1.0, 0.0);
    float angle = uRotationAngle;
    uv = mat2(cos(angle), -sin(angle), sin(angle), cos(angle)) * uv;
    uv = mat2(uRotation.x, -uRotation.y, uRotation.y, uRotation.x) * uv;
    radial = mat2(cos(angle), -sin(angle), sin(angle), cos(angle)) * radial;
    radial = mat2(uRotation.x, -uRotation.y, uRotation.y, uRotation.x) * radial;

    vec3 col = vec3(0.0);
    float layers = float(uLayers);
    for (int k = 0; k < 8; k++) {
      if (k >= uLayers) break;
      float i = float(k) / layers;
      float depth = fract(i + uDepth);
      float scale = mix(20.0 * uDensity, 0.5 * uDensity, depth);
      float fade = depth * smoothstep(1.0, 0.9, depth);
      vec2 offset = vec2(i * 453.32);
      col += StarLayer(uv * scale + offset, radial, vec2(0.0), 0.0, 1.0 / (scale * 0.16)) * fade;
    }
    col *= uReveal;
    outColor = vec4(mix(uBackground, col, uOpacity), 1.0);
  }`;

  function createShader(gl, type, source) {
    const s = gl.createShader(type);
    gl.shaderSource(s, source);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.error(gl.getShaderInfoLog(s));
      gl.deleteShader(s);
      return null;
    }
    return s;
  }

  const vShader = createShader(gl, gl.VERTEX_SHADER, VERTEX);
  const fShader = createShader(gl, gl.FRAGMENT_SHADER, FRAGMENT);
  if (!vShader || !fShader) return;

  const program = gl.createProgram();
  gl.attachShader(program, vShader);
  gl.attachShader(program, fShader);
  gl.bindAttribLocation(program, 0, 'aPosition');
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error(gl.getProgramInfoLog(program));
    return;
  }

  const uniforms = {};
  const count = gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < count; i++) {
    const info = gl.getActiveUniform(program, i);
    if (info) uniforms[info.name] = gl.getUniformLocation(program, info.name);
  }

  const buffer = gl.createBuffer();
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  // Settings matching user request (pure black, delicate stars, NO warp jump on click)
  const settings = {
    focal: [0.5, 0.5],
    rotation: [1, 0],
    starSpeed: 0.4,
    density: 1.1,
    hueShift: 140,
    speed: 1.0,
    glowIntensity: 0.32,
    saturation: 0.0,
    twinkleIntensity: 0.45,
    rotationSpeed: 0.06,
    starSize: 0.75, // Small crisp pinprick stars!
    flareIntensity: 1.0,
    layers: 4,
    opacity: 1.0,
    backgroundColor: [0, 0, 0] // PURE PITCH BLACK
  };

  const state = {
    time: 0,
    gloss: 0,
    depth: 0,
    angle: 0,
    reveal: 1.0
  };

  let last = 0;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    const w = Math.max(1, Math.round(window.innerWidth * dpr));
    const h = Math.max(1, Math.round(window.innerHeight * dpr));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
      gl.viewport(0, 0, w, h);
    }
  }

  window.addEventListener('resize', resize);
  resize();

  function render(now) {
    if (!last) last = now;
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;

    const flight = settings.starSpeed / 10.0;
    state.time += dt * settings.speed;
    state.gloss += dt * flight * settings.speed;
    state.depth += dt * flight * settings.speed;
    state.angle += dt * settings.rotationSpeed;

    gl.useProgram(program);
    gl.bindVertexArray(vao);
    gl.uniform1f(uniforms.uTime, state.time);
    gl.uniform2f(uniforms.uResolution, canvas.width, canvas.height);
    gl.uniform2f(uniforms.uFocal, settings.focal[0], settings.focal[1]);
    gl.uniform2f(uniforms.uRotation, settings.rotation[0], settings.rotation[1]);
    gl.uniform1f(uniforms.uGloss, state.gloss);
    gl.uniform1f(uniforms.uDepth, state.depth);
    gl.uniform1f(uniforms.uDensity, settings.density);
    gl.uniform1f(uniforms.uHueShift, settings.hueShift);
    gl.uniform1f(uniforms.uSpeed, settings.speed);
    gl.uniform2f(uniforms.uMouse, 0.5, 0.5);
    gl.uniform1f(uniforms.uStarGlow, (0.05 * settings.glowIntensity * settings.starSize));
    gl.uniform1f(uniforms.uFlareGain, settings.glowIntensity * settings.flareIntensity);
    gl.uniform1f(uniforms.uSquash, 0.0);
    gl.uniform1f(uniforms.uSaturation, settings.saturation);
    gl.uniform1f(uniforms.uMouseRepulsion, 0.0);
    gl.uniform1f(uniforms.uTwinkleIntensity, settings.twinkleIntensity);
    gl.uniform1f(uniforms.uRotationAngle, state.angle);
    gl.uniform1f(uniforms.uRepulsionStrength, 0.0);
    gl.uniform1f(uniforms.uMouseActiveFactor, 0.0);
    gl.uniform1f(uniforms.uAutoCenterRepulsion, 0.0);
    gl.uniform1i(uniforms.uLayers, settings.layers);
    gl.uniform1f(uniforms.uWarp, 0.0);
    gl.uniform1f(uniforms.uReveal, 1.0);
    gl.uniform1f(uniforms.uMode, 0.0);
    gl.uniform3fv(uniforms.uBackground, settings.backgroundColor);
    gl.uniform1f(uniforms.uOpacity, settings.opacity);

    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(render);
  }

  requestAnimationFrame(render);
})();
</script>
</body>
</html>
