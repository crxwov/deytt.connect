name: Ошибка в приложении
description: Сообщить о сбое или неверном поведении клиента
title: "[Ошибка] "
body:
  - type: markdown
    attributes:
      value: |
        Issues публичные. Не указывайте личные данные, Telegram-коды, ссылки подписки, VPN-ключи, конфигурации, IP-адреса и не прикладывайте снимки экрана с аккаунтом. Для вопросов по подписке используйте [поддержку в Telegram](https://t.me/deyttbot).
  - type: dropdown
    id: platform
    attributes:
      label: Платформа
      options:
        - Android
        - Windows
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: Версия приложения
      placeholder: Android 0.8.30 или Windows 0.8.40
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: Версия Android или Windows
      placeholder: Android 14 или Windows 11 24H2
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Устройство или компьютер
      placeholder: Например, Pixel 8a или Lenovo ThinkPad T14
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как повторить ошибку
      description: Напишите действия по порядку. Не включайте секреты и персональные данные.
      placeholder: |
        1. Открыл экран маршрутов
        2. Выбрал маршрут
        3. Нажал «Подключить»
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Что должно было произойти?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Что произошло?
    validations:
      required: true
