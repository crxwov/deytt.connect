name: Идея для приложения
description: Предложить улучшение и объяснить, кому оно поможет
title: "[Идея] "
body:
  - type: markdown
    attributes:
      value: |
        Не добавляйте личные данные, Telegram-коды, ссылки подписки, VPN-ключи, конфигурации или IP-адреса.
  - type: textarea
    id: problem
    attributes:
      label: Что сейчас неудобно?
      description: Опишите задачу, которую вы пытаетесь выполнить.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Как приложение могло бы помочь?
      description: Расскажите, какое поведение вы ожидаете.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Как вы решаете это сейчас?
      description: Необязательное поле.
