name: windows release

on:
  push:
    tags:
      - v0.8.20

permissions:
  contents: write

jobs:
  package-and-validate:
    if: github.repository == 'crxwov/deytt.connect'
    runs-on: windows-latest
    steps:
      - name: check out source
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: install pinned .net sdk
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (!(dotnet --list-sdks | Select-String '^10\.0\.401\s')) {
            $installer = Join-Path $env:RUNNER_TEMP 'dotnet-install.ps1'
            Invoke-WebRequest 'https://dot.net/v1/dotnet-install.ps1' -OutFile $installer
            & $installer -Version 10.0.401 -InstallDir (Join-Path $env:RUNNER_TEMP 'dotnet') -NoPath
            Add-Content $env:GITHUB_PATH (Join-Path $env:RUNNER_TEMP 'dotnet')
          }

      - name: set up go
        uses: actions/setup-go@v7
        with:
          go-version: 1.25.14

      - name: build windows package
        shell: bash
        env:
          DOTNET: dotnet
        run: DOTNET="$(command -v dotnet)" windows/scripts/build-windows-package.sh windows/artifacts/win-x64

      - name: prepare msi package layout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = (Resolve-Path 'windows/artifacts/win-x64').Path
          $stage = Join-Path (Resolve-Path 'windows/artifacts').Path 'msi-stage'
          Copy-Item -LiteralPath $source -Destination $stage -Recurse
          $service = Join-Path $stage 'service'
          if (!(Test-Path -LiteralPath $service -PathType Container)) { throw 'service payload folder is missing' }
          if (Get-ChildItem -LiteralPath $service -Directory -Recurse) { throw 'unexpected nested service payload' }
          foreach ($file in Get-ChildItem -LiteralPath $service -File) {
            $target = Join-Path $stage $file.Name
            if (Test-Path -LiteralPath $target -PathType Leaf) {
              if ((Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash -ne (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash) {
                throw "conflicting app and service payload file: $($file.Name)"
              }
            } else {
              Copy-Item -LiteralPath $file.FullName -Destination $target
            }
          }
          Remove-Item -LiteralPath $service -Recurse -Force

      - name: build msi
        shell: pwsh
        run: >-
          ./windows/installer/Build-Msi.ps1
          -ProductVersion 0.8.20
          -PackageStageDir windows/artifacts/msi-stage
          -BuildRoot windows/artifacts/msi-build
          -Dotnet dotnet

      - name: test clean install, repair, and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = (Resolve-Path 'windows/artifacts/msi-build/output/DEYTTConnect.Windows.Installer.msi').Path
          $installLog = Join-Path $env:RUNNER_TEMP 'deytt-install.log'
          $repairLog = Join-Path $env:RUNNER_TEMP 'deytt-repair.log'
          $removeLog = Join-Path $env:RUNNER_TEMP 'deytt-remove.log'
          $install = Start-Process msiexec.exe -ArgumentList @('/i', "`"$msi`"", '/qn', '/norestart', '/l*v', "`"$installLog`"") -Wait -PassThru
          if ($install.ExitCode -notin @(0, 3010)) { Get-Content $installLog -Tail 100; throw "clean install failed: $($install.ExitCode)" }
          $app = Join-Path $env:ProgramFiles 'DEYTT/Connect/DeyttConnect.Windows.exe'
          if (!(Test-Path $app)) { throw 'installed app executable is missing' }
          $service = Get-Service -Name 'DEYTTConnectVpn' -ErrorAction Stop
          $uninstall = Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*', 'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -eq 'deytt connect' } | Select-Object -First 1
          if (!$uninstall) { throw 'installed product registration is missing' }
          $productCode = $uninstall.PSChildName
          if (!(Test-Path (Join-Path $env:ProgramData 'Microsoft/Windows/Start Menu/Programs/DEYTT Connect'))) {
            $startMenu = Join-Path $env:APPDATA 'Microsoft/Windows/Start Menu/Programs/deytt connect.lnk'
            if (!(Test-Path $startMenu)) { Write-Host 'start menu shortcut is per-user or localized; MSI metadata already checks it' }
          }
          $repair = Start-Process msiexec.exe -ArgumentList @('/fa', $productCode, '/qn', '/norestart', '/l*v', "`"$repairLog`"") -Wait -PassThru
          if ($repair.ExitCode -notin @(0, 3010)) { Get-Content $repairLog -Tail 100; throw "repair failed: $($repair.ExitCode)" }
          $remove = Start-Process msiexec.exe -ArgumentList @('/x', $productCode, '/qn', '/norestart', '/l*v', "`"$removeLog`"") -Wait -PassThru
          if ($remove.ExitCode -notin @(0, 3010)) { Get-Content $removeLog -Tail 100; throw "uninstall failed: $($remove.ExitCode)" }
          if (Test-Path $app) { throw 'application files remain after uninstall' }
          if (Get-Service -Name 'DEYTTConnectVpn' -ErrorAction SilentlyContinue) { throw 'vpn service remains after uninstall' }

      - name: prepare release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = 'windows/artifacts/release-assets'
          New-Item -ItemType Directory -Force -Path $assets | Out-Null
          Compress-Archive -Path 'windows/artifacts/win-x64/*' -DestinationPath "$assets/deytt-connect-windows-x64.zip" -CompressionLevel Optimal
          Copy-Item 'windows/artifacts/msi-build/output/DEYTTConnect.Windows.Installer.msi' "$assets/deytt-connect-windows-x64.msi"
          Get-FileHash "$assets/deytt-connect-windows-x64.zip" -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  deytt-connect-windows-x64.zip" } | Set-Content "$assets/deytt-connect-windows-x64.zip.sha256" -Encoding ascii
          Get-FileHash "$assets/deytt-connect-windows-x64.msi" -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  deytt-connect-windows-x64.msi" } | Set-Content "$assets/deytt-connect-windows-x64.msi.sha256" -Encoding ascii
          Get-Content "$assets/deytt-connect-windows-x64.zip.sha256", "$assets/deytt-connect-windows-x64.msi.sha256" | Set-Content "$assets/SHA256SUMS.txt" -Encoding ascii

      - name: create stable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          @'
          исправлена стабильность приложения, добавлено отображение доступных маршрутов италии и amneziawg из подписки, улучшены проверки доступности серверов.

          windows: установщик msi или портативный zip. msi проверяется на чистую установку, восстановление и удаление.

          android: опубликованы apk для arm64-v8a, armeabi-v7a и x86_64. при первом переходе на новый ключ потребуется удалить предыдущую версию и установить apk заново.
          '@ | Set-Content $notes -Encoding utf8
          $assets = @(
            'windows/artifacts/release-assets/deytt-connect-windows-x64.zip',
            'windows/artifacts/release-assets/deytt-connect-windows-x64.zip.sha256',
            'windows/artifacts/release-assets/deytt-connect-windows-x64.msi',
            'windows/artifacts/release-assets/deytt-connect-windows-x64.msi.sha256',
            'windows/artifacts/release-assets/SHA256SUMS.txt'
          )
          gh release view v0.8.20 --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v0.8.20 @assets --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw 'release asset upload failed' }
            gh release edit v0.8.20 --repo $env:GITHUB_REPOSITORY --title 'deytt connect 0.8.20' --notes-file $notes
          } else {
            gh release create v0.8.20 @assets --repo $env:GITHUB_REPOSITORY --title 'deytt connect 0.8.20' --notes-file $notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'release publication failed' }

  android-apk-publishing:
    name: android apk publishing
    needs: package-and-validate
    if: github.repository == 'crxwov/deytt.connect'
    runs-on: ubuntu-latest
    steps:
      - name: check out source and submodules
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          submodules: recursive

      - name: set up java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: set up go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.14'
          cache-dependency-path: awg-tunnel/src/main/go/go.sum

      - name: set up android sdk
        uses: android-actions/setup-android@v4

      - name: set up gradle
        uses: gradle/actions/setup-gradle@v6

      - name: install pinned android sdk components
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-35"
          "build-tools;35.0.0"
          "ndk;26.1.10909125"
          "cmake;3.22.1"

      - name: build unsigned release apks
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleRelease

      - name: prepare signing credentials
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64"
          test -n "$ANDROID_RELEASE_KEY_PASSWORD"
          umask 077
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/deytt-connect-release.p12"
          printf '%s' "$ANDROID_RELEASE_KEY_PASSWORD" > "$RUNNER_TEMP/deytt-connect-release.password"

      - name: sign and verify apks
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p output/android
          release_version="${RELEASE_TAG#v}"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            input="app/build/outputs/apk/release/app-${abi}-release-unsigned.apk"
            output="output/android/deytt-connect-${release_version}-manual-reinstall-${abi}.apk"
            updater_output="output/android/app-${abi}-release.apk"
            test -f "$input"
            python3 scripts/release.py sign "$input" \
              --output "$output" \
              --keystore "$RUNNER_TEMP/deytt-connect-release.p12" \
              --password-file "$RUNNER_TEMP/deytt-connect-release.password"
            python3 scripts/release.py verify "$output"
            (cd output/android && sha256sum "$(basename "$output")" > "$(basename "$output").sha256")
            cp "$output" "$updater_output"
            python3 scripts/release.py verify "$updater_output"
            (cd output/android && sha256sum "app-${abi}-release.apk" > "app-${abi}-release.apk.sha256")
          done

      - name: publish apks and lowercase install notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/release-notes.md"
          release_version="${RELEASE_TAG#v}"
          python3 - <<'PY'
          import os
          from pathlib import Path

          notes = Path(os.environ["RUNNER_TEMP"]) / "release-notes.md"
          body = notes.read_text(encoding="utf-8").rstrip()
          marker = "## android manual installation — new signing key"
          if marker in body:
              body = body.split(marker, 1)[0].rstrip()
          body += """

          ---

          ## android manual installation — new signing key

          эти apk подписаны новым ключом, поскольку прежний закрытый ключ недоступен. android не установит их поверх deytt connect, подписанного старым ключом. также опубликованы файлы app-{abi}-release.apk для проверки и установки обновлений внутри приложения.

          1. убедитесь, что можете войти в аккаунт deytt connect.
          2. если приложение установлено со старым ключом, сначала удалите его. android может стереть настройки и сохранённый вход.
          3. скачайте apk для своего устройства: arm64-v8a для большинства современных телефонов, armeabi-v7a для старых 32-битных устройств или x86_64 для android на x86.
          4. установите apk, откройте приложение и войдите снова.

          будущие обновления внутри приложения используют тот же новый ключ.
          """
          notes.write_text(body.rstrip() + "\n", encoding="utf-8")
          PY
          gh release upload "$RELEASE_TAG" \
            output/android/app-arm64-v8a-release.apk \
            output/android/app-arm64-v8a-release.apk.sha256 \
            output/android/app-armeabi-v7a-release.apk \
            output/android/app-armeabi-v7a-release.apk.sha256 \
            output/android/app-x86_64-release.apk \
            output/android/app-x86_64-release.apk.sha256 \
            "output/android/deytt-connect-${release_version}-manual-reinstall-arm64-v8a.apk" \
            "output/android/deytt-connect-${release_version}-manual-reinstall-arm64-v8a.apk.sha256" \
            "output/android/deytt-connect-${release_version}-manual-reinstall-armeabi-v7a.apk" \
            "output/android/deytt-connect-${release_version}-manual-reinstall-armeabi-v7a.apk.sha256" \
            "output/android/deytt-connect-${release_version}-manual-reinstall-x86_64.apk" \
            "output/android/deytt-connect-${release_version}-manual-reinstall-x86_64.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/release-notes.md"
