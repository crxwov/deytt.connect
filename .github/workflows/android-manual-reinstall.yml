name: Android signing-key migration and release APK publishing

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable release to attach the signed APKs to
        required: true
        type: string
        default: v0.8.18

permissions:
  contents: write

jobs:
  build-and-publish:
    if: github.repository == 'crxwov/deytt.connect'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.14'
          cache-dependency-path: awg-tunnel/src/main/go/go.sum

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install pinned Android SDK components
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-35"
          "build-tools;35.0.0"
          "ndk;26.1.10909125"
          "cmake;3.22.1"

      - name: Validate release target
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          case "$RELEASE_TAG" in
            v0.8.18|v0.8.18-preview.1) ;;
            *)
              echo "This signing-key migration workflow only publishes v0.8.18 releases." >&2
              exit 1
              ;;
          esac

      - name: Build unsigned release APKs
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleRelease

      - name: Prepare signing credentials
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64"
          test -n "$ANDROID_RELEASE_KEY_PASSWORD"
          umask 077
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/deytt-connect-release.p12"
          printf '%s' "$ANDROID_RELEASE_KEY_PASSWORD" > "$RUNNER_TEMP/deytt-connect-release.password"

      - name: Sign, verify, and expose updater-compatible APK names
        run: |
          set -euo pipefail
          mkdir -p output/android
          for abi in arm64-v8a armeabi-v7a x86_64; do
            input="app/build/outputs/apk/release/app-${abi}-release-unsigned.apk"
            output="output/android/deytt-connect-0.8.18-manual-reinstall-${abi}.apk"
            updater_output="output/android/app-${abi}-release.apk"
            test -f "$input"
            python3 scripts/release.py sign "$input" \
              --output "$output" \
              --keystore "$RUNNER_TEMP/deytt-connect-release.p12" \
              --password-file "$RUNNER_TEMP/deytt-connect-release.password"
            python3 scripts/release.py verify "$output"
            cp "$output" "$updater_output"
            python3 scripts/release.py verify "$updater_output"
            (cd output/android && sha256sum "app-${abi}-release.apk" > "app-${abi}-release.apk.sha256")
          done

      - name: Publish APKs and manual-install instructions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/release-notes.md"
          python3 - <<'PY'
          import os
          from pathlib import Path

          notes = Path(os.environ["RUNNER_TEMP"]) / "release-notes.md"
          body = notes.read_text(encoding="utf-8").rstrip()
          marker = "## Android manual installation — new signing key"
          if marker in body:
              body = body.split(marker, 1)[0].rstrip()
          body += """

          ---

          ## Android manual installation — new signing key

          These APKs use a new signing key because the previous private key is unavailable. Android cannot install them over an existing DEYTT Connect APK signed with the old key. Updater-compatible app-{abi}-release.apk assets are also published so the app can find and verify these downloads.

          1. Make sure you can sign in to your DEYTT Connect account.
          2. If the app is already installed with the old signing key, uninstall it first. Android may erase its local settings and saved sign-in state.
          3. Download the APK matching your device: arm64-v8a for most modern phones, armeabi-v7a for older 32-bit ARM devices, or x86_64 for x86 Android devices.
          4. Install the APK, open the app, and sign in again.

          Future in-app APK updates require the same new signing key.
          """
          notes.write_text(body.rstrip() + "\n", encoding="utf-8")
          PY
          gh release upload "$RELEASE_TAG" \
            output/android/app-arm64-v8a-release.apk \
            output/android/app-arm64-v8a-release.apk.sha256 \
            output/android/app-armeabi-v7a-release.apk \
            output/android/app-armeabi-v7a-release.apk.sha256 \
            output/android/app-x86_64-release.apk \
            output/android/app-x86_64-release.apk.sha256 \
            output/android/deytt-connect-0.8.18-manual-reinstall-arm64-v8a.apk \
            output/android/deytt-connect-0.8.18-manual-reinstall-arm64-v8a.apk.sha256 \
            output/android/deytt-connect-0.8.18-manual-reinstall-armeabi-v7a.apk \
            output/android/deytt-connect-0.8.18-manual-reinstall-armeabi-v7a.apk.sha256 \
            output/android/deytt-connect-0.8.18-manual-reinstall-x86_64.apk \
            output/android/deytt-connect-0.8.18-manual-reinstall-x86_64.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/release-notes.md"
