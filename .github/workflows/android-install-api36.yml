name: Android 16 APK install smoke

on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: Release tag to clean-install and upgrade to
        required: true
        type: string
        default: v0.11.68
      target_sha256:
        description: Expected SHA-256 of the target universal APK
        required: true
        type: string
        default: 33f3e0c86bfcc6a3ea1c739fa037028604eb9752a4ab9f9db4ac26a7abd1526f
      baseline_tag:
        description: Release tag to install before the target upgrade
        required: true
        type: string
        default: v0.11.67
      baseline_sha256:
        description: Expected SHA-256 of the baseline universal APK
        required: true
        type: string
        default: e4d104b5c70aa5924f59109b3c6adaf263dbcc3b5b0ebd44f0ad4125a58b7d55
      target_version_code:
        description: Expected Android versionCode of the target APK
        required: true
        type: string
        default: "98"

permissions:
  contents: read

jobs:
  install-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - page_bytes: 4096
            image: google_apis
          - page_bytes: 16384
            image: google_apis_ps16k
    env:
      SYSTEM_IMAGE: system-images;android-36;${{ matrix.image }};x86_64
      EXPECTED_PAGE_SIZE: ${{ matrix.page_bytes }}
    steps:
      - name: Validate dispatch inputs
        id: validate
        shell: bash
        env:
          TARGET_TAG_INPUT: ${{ inputs.target_tag }}
          TARGET_SHA256_INPUT: ${{ inputs.target_sha256 }}
          BASELINE_TAG_INPUT: ${{ inputs.baseline_tag }}
          BASELINE_SHA256_INPUT: ${{ inputs.baseline_sha256 }}
          TARGET_VERSION_CODE_INPUT: ${{ inputs.target_version_code }}
        run: |
          set -euo pipefail
          [[ "$TARGET_TAG_INPUT" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid target release tag" >&2; exit 1; }
          [[ "$BASELINE_TAG_INPUT" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid baseline release tag" >&2; exit 1; }
          [[ "$TARGET_SHA256_INPUT" =~ ^[0-9a-fA-F]{64}$ ]] || { echo "Invalid target SHA-256" >&2; exit 1; }
          [[ "$BASELINE_SHA256_INPUT" =~ ^[0-9a-fA-F]{64}$ ]] || { echo "Invalid baseline SHA-256" >&2; exit 1; }
          [[ "$TARGET_VERSION_CODE_INPUT" =~ ^[1-9][0-9]{0,8}$ ]] || { echo "Invalid target versionCode" >&2; exit 1; }
          [[ "$TARGET_TAG_INPUT" != "$BASELINE_TAG_INPUT" ]] || { echo "Target and baseline tags must differ" >&2; exit 1; }
          {
            echo "target_tag=$TARGET_TAG_INPUT"
            echo "target_sha256=$TARGET_SHA256_INPUT"
            echo "baseline_tag=$BASELINE_TAG_INPUT"
            echo "baseline_sha256=$BASELINE_SHA256_INPUT"
            echo "target_version_code=$TARGET_VERSION_CODE_INPUT"
          } >> "$GITHUB_OUTPUT"

      - name: Create evidence directory
        run: mkdir -p "$RUNNER_TEMP/android-api36-smoke/apks" "$RUNNER_TEMP/android-api36-smoke/logs"

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$ANDROID_HOME/platform-tools/adb"
          printf '%s\n' \
            "$ANDROID_HOME/cmdline-tools/latest/bin" \
            "$ANDROID_HOME/platform-tools" \
            "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"

      - name: Install API 36 emulator packages
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "emulator" \
            "$SYSTEM_IMAGE"

      - name: Download and verify release APKs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ steps.validate.outputs.target_tag }}
          TARGET_SHA256: ${{ steps.validate.outputs.target_sha256 }}
          BASELINE_TAG: ${{ steps.validate.outputs.baseline_tag }}
          BASELINE_SHA256: ${{ steps.validate.outputs.baseline_sha256 }}
          TARGET_VERSION_CODE: ${{ steps.validate.outputs.target_version_code }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          dir="$RUNNER_TEMP/android-api36-smoke/apks"
          logs="$RUNNER_TEMP/android-api36-smoke/logs"

          download_release_apk() {
            local tag="$1" expected_sha="$2" metadata="$logs/$1-release.json"
            gh api "repos/$repo/releases/tags/$tag" > "$metadata"
            jq -e --arg tag "$tag" \
              '.tag_name == $tag and (.draft == false) and any(.assets[]; .name == "app-universal-release.apk" and .state == "uploaded")' \
              "$metadata" >/dev/null
            gh release download "$tag" --repo "$repo" --pattern app-universal-release.apk --dir "$dir"
            local apk="$dir/app-universal-release.apk"
            mv "$apk" "$dir/$tag-app-universal-release.apk"
            printf '%s  %s\n' "$expected_sha" "$dir/$tag-app-universal-release.apk" | sha256sum --check
            sha256sum "$dir/$tag-app-universal-release.apk" | tee -a "$logs/apk-sha256.txt"
          }

          download_release_apk "$BASELINE_TAG" "$BASELINE_SHA256"
          download_release_apk "$TARGET_TAG" "$TARGET_SHA256"

          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          target_version="${TARGET_TAG#v}"
          for tag in "$BASELINE_TAG" "$TARGET_TAG"; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs \
              --min-sdk-version 36 --max-sdk-version 36 "$dir/$tag-app-universal-release.apk" \
              > "$logs/$tag-signature.txt"
            grep -Fq 'Signer #1 certificate SHA-256 digest: bb39b663e555c7ed7b725c543ed73ea2602432b003591b2e1370f0359c4c4333' "$logs/$tag-signature.txt"
            "$aapt" dump badging "$dir/$tag-app-universal-release.apk" | sed -n '1p' | tee "$logs/$tag-badging.txt"
            grep -Fq "name='space.deytt.connect'" "$logs/$tag-badging.txt"
          done
          grep -Fq "versionName='${BASELINE_TAG#v}'" "$logs/$BASELINE_TAG-badging.txt"
          grep -Fq "versionName='$target_version'" "$logs/$TARGET_TAG-badging.txt"
          grep -Fq "versionCode='$TARGET_VERSION_CODE'" "$logs/$TARGET_TAG-badging.txt"
          baseline_version_code="$(sed -nE "s/.*versionCode='([0-9]+)'.*/\1/p" "$logs/$BASELINE_TAG-badging.txt")"
          [[ "$baseline_version_code" =~ ^[0-9]+$ && "$TARGET_VERSION_CODE" -gt "$baseline_version_code" ]] || {
            echo "Target versionCode must be greater than baseline versionCode" >&2
            exit 1
          }

      - name: Start disposable API 36 emulator
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-api36-smoke/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd \
            --name api36-smoke \
            --package "$SYSTEM_IMAGE" \
            --device pixel_2 \
            --force
          test -f "$ANDROID_AVD_HOME/api36-smoke.ini"
          avdmanager list avd
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          emulator -accel-check
          nohup emulator -avd api36-smoke \
            -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics \
            -gpu swiftshader -accel on -wipe-data \
            > "$RUNNER_TEMP/android-api36-smoke/logs/emulator.log" 2>&1 &
          timeout 120 adb wait-for-device
          for attempt in $(seq 1 120); do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              break
            fi
            if [[ "$attempt" == 120 ]]; then
              echo "API 36 emulator did not complete boot within 10 minutes" >&2
              exit 1
            fi
            sleep 5
          done
          adb shell input keyevent 82
          adb shell getprop ro.build.version.sdk | tee "$RUNNER_TEMP/android-api36-smoke/logs/api-level.txt"
          test "$(cat "$RUNNER_TEMP/android-api36-smoke/logs/api-level.txt" | tr -d '\r')" = 36
          adb shell getconf PAGE_SIZE | tee "$RUNNER_TEMP/android-api36-smoke/logs/page-size.txt"
          test "$(cat "$RUNNER_TEMP/android-api36-smoke/logs/page-size.txt" | tr -d '\r')" = "$EXPECTED_PAGE_SIZE"

      - name: Test fresh install and in-place upgrades
        shell: bash
        env:
          TARGET_TAG: ${{ steps.validate.outputs.target_tag }}
          BASELINE_TAG: ${{ steps.validate.outputs.baseline_tag }}
          TARGET_VERSION_CODE: ${{ steps.validate.outputs.target_version_code }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/android-api36-smoke/apks"
          logs="$RUNNER_TEMP/android-api36-smoke/logs"
          package=space.deytt.connect
          baseline="$dir/$BASELINE_TAG-app-universal-release.apk"
          target="$dir/$TARGET_TAG-app-universal-release.apk"

          launch_and_capture() {
            local label="$1" expected_version_code="$2"
            local activity="$logs/$label-activity.txt" crash="$logs/$label-android-runtime.txt"
            adb logcat -c
            adb shell am force-stop "$package"
            if ! adb shell am start -W -n "$package/.MainActivity" > "$activity" 2>&1; then
              return 1
            fi
            sleep 8
            adb shell dumpsys package "$package" > "$logs/$label-package.txt"
            adb shell dumpsys activity activities > "$logs/$label-activities.txt"
            adb logcat -d -s AndroidRuntime:E > "$crash"
            if grep -Eq 'FATAL EXCEPTION|Process: space\.deytt\.connect' "$crash"; then
              return 1
            fi
            if ! grep -Eq "versionCode=$expected_version_code([[:space:]]|$)" "$logs/$label-package.txt"; then
              return 1
            fi
            if ! grep -E 'mResumedActivity|topResumedActivity' "$logs/$label-activities.txt" | grep -F "$package" >/dev/null; then
              return 1
            fi
            printf '%s: COLD LAUNCH OK\n' "$label" | tee -a "$logs/summary.txt"
          }

          adb uninstall "$package" > "$logs/fresh-target-uninstall.txt" 2>&1 || true
          adb install "$target" > "$logs/fresh-$TARGET_TAG-install.txt" 2>&1
          if ! grep -Eq "versionCode=$TARGET_VERSION_CODE([[:space:]]|$)" <(adb shell dumpsys package "$package"); then
            echo "Fresh install did not install target versionCode $TARGET_VERSION_CODE" >&2
            exit 1
          fi
          launch_and_capture "fresh-$TARGET_TAG" "$TARGET_VERSION_CODE"
          printf 'Fresh install and cold launch passed for %s (versionCode %s)\n' \
            "$TARGET_TAG" "$TARGET_VERSION_CODE" | tee -a "$logs/summary.txt"

          adb uninstall "$package" >/dev/null 2>&1 || true
          adb install "$baseline" > "$logs/upgrade-$BASELINE_TAG-to-$TARGET_TAG-baseline-install.txt" 2>&1
          adb install -r "$target" > "$logs/upgrade-$BASELINE_TAG-to-$TARGET_TAG-install.txt" 2>&1
          if ! grep -Eq "versionCode=$TARGET_VERSION_CODE([[:space:]]|$)" <(adb shell dumpsys package "$package"); then
            echo "In-place upgrade did not install target versionCode $TARGET_VERSION_CODE" >&2
            exit 1
          fi
          launch_and_capture "upgrade-$BASELINE_TAG-to-$TARGET_TAG" "$TARGET_VERSION_CODE"
          printf 'In-place upgrade and cold launch passed for %s -> %s (versionCode %s)\n' \
            "$BASELINE_TAG" "$TARGET_TAG" "$TARGET_VERSION_CODE" | tee -a "$logs/summary.txt"

      - name: Check inline loading frames on Android 16
        if: matrix.page_bytes == 4096
        shell: bash
        env:
          TARGET_TAG: ${{ steps.validate.outputs.target_tag }}
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/android-inline-ui"
          logs="$RUNNER_TEMP/android-api36-smoke/logs"
          git clone --depth 1 --branch "$TARGET_TAG" "https://github.com/$GITHUB_REPOSITORY.git" "$source_dir"
          expected_revision="$(jq -r '.target_commitish' "$logs/$TARGET_TAG-release.json")"
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$expected_revision"
          git -C "$source_dir" submodule update --init --depth 1 third_party/amneziawg-android
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          sdkmanager "ndk;26.1.10909125" "cmake;3.22.1"
          cd "$source_dir"
          # This isolated UI fixture never connects a tunnel; test the production Kotlin renderer without rebuilding VPN engines.
          cat > "$RUNNER_TEMP/inline-ui.gradle" <<'GRADLE'
          allprojects {
              tasks.configureEach {
                  if (name.contains('CMake') || name.startsWith('externalNativeBuild') ||
                      name == 'prepareWindowsAwgGo' || name == 'prepareDeyttAwgBackendMakefile') enabled = false
              }
          }
          GRADLE
          bash gradlew :app:assembleDebug :app:assembleDebugAndroidTest \
            -PisolatedQa=true -PqaVersionCode=1 \
            -PqaRunner=space.deytt.connect.InlineMetricProgressInstrumentation \
            "-Pandroid.aapt2FromMavenOverride=$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            -Pkotlin.compiler.execution.strategy=in-process \
            -I "$RUNNER_TEMP/inline-ui.gradle" --no-daemon --max-workers=2 --console=plain \
            > "$logs/inline-ui-build.txt" 2>&1 || { tail -n 120 "$logs/inline-ui-build.txt"; exit 1; }
          adb install app/build/outputs/apk/debug/app-debug.apk
          adb install app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell am instrument -w \
            space.deytt.connect.qa.test/space.deytt.connect.InlineMetricProgressInstrumentation \
            | tee "$logs/inline-animation.txt"
          grep -Fq 'INSTRUMENTATION_RESULT: result=PASS:' "$logs/inline-animation.txt"

      - name: Print bounded emulator diagnostics
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          logs="$RUNNER_TEMP/android-api36-smoke/logs"
          shopt -s nullglob
          files=(
            "$logs/summary.txt"
            "$logs/apk-sha256.txt"
            "$logs/api-level.txt"
            "$logs/page-size.txt"
            "$logs/inline-animation.txt"
            "$logs"/*-badging.txt
            "$logs"/*-signature.txt
            "$logs"/*-install.txt
            "$logs"/*-activity.txt
            "$logs"/*-android-runtime.txt
          )
          for file in "${files[@]}"; do
            [[ -f "$file" ]] || continue
            printf '\n--- %s (first 120 lines) ---\n' "$(basename "$file")"
            sed -n '1,120p' "$file"
          done
          if [[ "$JOB_STATUS" != success && -f "$logs/emulator.log" ]]; then
            printf '\n--- emulator.log (last 120 lines) ---\n'
            tail -n 120 "$logs/emulator.log"
          fi

