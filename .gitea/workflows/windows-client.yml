name: Windows client fast verification

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "windows/**"
      - ".gitea/workflows/windows-client.yml"
jobs:
  fast-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          github-server-url: https://ru.deytt.space
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: url.https://ru.deytt.space/git/.insteadOf
          GIT_CONFIG_VALUE_0: https://ru.deytt.space/

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
        env:
          DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet

      - name: Run local fast verification
        run: bash windows/scripts/verify-fast.sh
