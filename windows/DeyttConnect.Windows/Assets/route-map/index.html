<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>deytt. · подключение</title>
  <link rel="stylesheet" href="network-atlas.css?v=20261021_03">
  <script defer src="network-atlas.js?v=20261021_03"></script>
  <script defer src="atlas-init.js?v=20261021_03"></script>

  <style>
    :root {
      --header-bg: transparent;
      --header-border: transparent;
      --nav-bg: rgba(255, 255, 255, 0.025);
      --nav-border: rgba(255, 255, 255, 0.08);
      --nav-border-top: rgba(255, 255, 255, 0.20);
      --nav-border-bottom: rgba(0, 0, 0, 0.35);
      --nav-shadow: 0 12px 32px -4px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.10);
      --nav-pill-bg: linear-gradient(180deg, rgba(255, 255, 255, 0.09) 0%, rgba(255, 255, 255, 0.025) 100%);
      --nav-pill-border: rgba(255, 255, 255, 0.16);
      --nav-pill-border-top: rgba(255, 255, 255, 0.45);
      --nav-pill-border-bottom: rgba(0, 0, 0, 0.25);
      --nav-pill-shadow: 0 4px 16px -2px rgba(0, 0, 0, 0.35), inset 0 1px 0 0 rgba(255, 255, 255, 0.25);
      --text: #F8FAFC;
      --text-muted: #8E9EAF;
    }

    html[data-theme="light"] {
      --header-bg: transparent;
      --header-border: transparent;
      --nav-bg: rgba(255, 255, 255, 0.85);
      --nav-border: rgba(0, 0, 0, 0.08);
      --nav-border-top: rgba(255, 255, 255, 1);
      --nav-border-bottom: rgba(0, 0, 0, 0.10);
      --nav-shadow: inset 0 1px 2px 0 #FFFFFF, 0 6px 20px -2px rgba(0, 0, 0, 0.06);
      --nav-pill-bg: linear-gradient(180deg, #FFFFFF 0%, rgba(246, 249, 255, 0.96) 100%);
      --nav-pill-border: rgba(0, 0, 0, 0.10);
      --nav-pill-border-top: #FFFFFF;
      --nav-pill-border-bottom: rgba(0, 0, 0, 0.12);
      --nav-pill-shadow: 0 4px 14px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.04), inset 0 1px 1px #FFFFFF;
      --text: #0F172A;
      --text-muted: #5C6E82;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      user-select: none;
      position: relative;
    }

    html[data-theme="dark"] body {
      background: #0B111B;
      color: #F8FAFC;
    }

    html[data-theme="light"] body {
      background: #F4F7FB;
      color: #0F172A;
    }

    /* Floating Transparent Header on Stars */
    .desktop-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 68px;
      min-height: 68px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      background: transparent;
      border-bottom: none;
      box-shadow: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      z-index: 100;
      pointer-events: none;
    }

    .brand-area,
    .nav-container,
    .window-controls {
      pointer-events: auto;
    }

    .brand-area {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 160px;
    }

    .brand-logo {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--text);
      display: inline-flex;
      align-items: baseline;
    }

    .brand-dot {
      color: #38BDF8;
      font-size: 24px;
      line-height: 0;
    }

    /* Modern Glass Navigation Capsule Dock */
    .nav-container {
      position: relative;
      display: inline-flex;
      align-items: center;
      background: var(--nav-bg);
      border: 1px solid var(--nav-border);
      border-top-color: var(--nav-border-top);
      border-bottom-color: var(--nav-border-bottom);
      border-radius: 20px;
      padding: 6px;
      box-shadow: var(--nav-shadow);
      backdrop-filter: blur(24px) saturate(190%);
      -webkit-backdrop-filter: blur(24px) saturate(190%);
    }

    /* Clean Elevated Glass Pill */
    .nav-jelly-pill {
      position: absolute;
      top: 6px;
      left: 0;
      height: calc(100% - 12px);
      background: var(--nav-pill-bg);
      border: 1px solid var(--nav-pill-border);
      border-top-color: var(--nav-pill-border-top);
      border-bottom-color: var(--nav-pill-border-bottom);
      border-radius: 14px;
      box-shadow: var(--nav-pill-shadow);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      pointer-events: none;
      z-index: 1;
      transform-origin: center center;
      transition: left 240ms cubic-bezier(0.2, 0.9, 0.3, 1),
                  width 240ms cubic-bezier(0.2, 0.9, 0.3, 1);
    }

    .nav-item {
      position: relative;
      z-index: 2;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 14.5px;
      font-weight: 500;
      padding: 9px 24px;
      border-radius: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      transition: color 150ms ease, background 150ms ease;
    }

    .nav-item:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.05);
    }

    html[data-theme="light"] .nav-item:hover {
      background: rgba(0, 0, 0, 0.04);
      color: #0F172A;
    }

    .nav-item.is-active {
      color: #FFFFFF;
      font-weight: 600;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
    }

    html[data-theme="light"] .nav-item.is-active {
      color: #0F172A;
      text-shadow: none;
    }

    .nav-item svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @keyframes jelly-micro-spring {
      0% { transform: translateX(0); }
      40% { transform: translateX(0.35px); }
      75% { transform: translateX(-0.15px); }
      100% { transform: translateX(0); }
    }

    .nav-item.has-shaken .nav-label-wrap {
      animation: jelly-micro-spring 160ms cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      display: inline-flex;
      align-items: center;
      gap: 9px;
    }

    .window-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 160px;
      justify-content: flex-end;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 140ms ease;
    }

    .icon-btn:hover {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.04) 100%);
      color: var(--text);
      border-color: rgba(255, 255, 255, 0.22);
      border-top-color: rgba(255, 255, 255, 0.5);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4), 0 2px 8px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    html[data-theme="light"] .icon-btn:hover {
      background: linear-gradient(180deg, #FFFFFF 0%, rgba(245, 248, 255, 0.95) 100%);
      border-color: rgba(0, 0, 0, 0.1);
      border-top-color: #FFFFFF;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    .icon-btn svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .window-divider {
      width: 1px;
      height: 18px;
      background: rgba(255, 255, 255, 0.12);
      margin: 0 4px;
    }

    html[data-theme="light"] .window-divider {
      background: rgba(0, 0, 0, 0.10);
    }

    #stars-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      transform: translateZ(0);
      will-change: transform;
    }

    /* Viewport filling main container */
    .app-viewport {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 1;
    }

    .network-atlas {
      width: 100%;
      height: 100%;
    }

    .motion-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(30px);
      opacity: 0;
      pointer-events: none;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(8px);
      color: #FFFFFF;
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 500;
      transition: all 220ms cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 2000;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .motion-toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>

  <script>
    // Zero-overhead static background canvas (renders once, 0% CPU overhead while spinning globe)
    (function initBackgroundCanvas() {
      const canvas = document.getElementById("stars-canvas");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");

      function renderBackground() {
        const dpr = Math.min(2, window.devicePixelRatio || 1);
        const width = window.innerWidth;
        const height = window.innerHeight;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.scale(dpr, dpr);
        ctx.clearRect(0, 0, width, height);

        const isLight = document.documentElement.dataset.theme === "light";

        if (!isLight) {
          // Dark Theme: Deep Space Starry Sky
          const count = Math.floor((width * height) / 3200);
          for (let i = 0; i < count; i++) {
            const x = Math.random() * width;
            const y = Math.random() * height;
            const radius = Math.random() < 0.85 ? (Math.random() * 0.7 + 0.3) : (Math.random() * 1.1 + 0.8);
            const alpha = Math.random() * 0.65 + 0.25;
            ctx.fillStyle = `rgba(235, 245, 255, ${alpha})`;
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fill();
          }
        } else {
          // Light Theme: Peaceful Daylight Sky with Soft Cirrus Clouds & Sunlit Motes
          // 1. Soft daylight sky background
          const skyGrad = ctx.createLinearGradient(0, 0, 0, height);
          skyGrad.addColorStop(0, "#EBF3FA");
          skyGrad.addColorStop(0.5, "#F4F8FC");
          skyGrad.addColorStop(1, "#EDF3F9");
          ctx.fillStyle = skyGrad;
          ctx.fillRect(0, 0, width, height);

          // 2. Soft sunlit ambient bloom from top-left
          const sunGlow = ctx.createRadialGradient(width * 0.18, height * 0.15, 10, width * 0.25, height * 0.22, Math.max(width, height) * 0.7);
          sunGlow.addColorStop(0, "rgba(220, 240, 255, 0.55)");
          sunGlow.addColorStop(0.4, "rgba(235, 246, 255, 0.25)");
          sunGlow.addColorStop(1, "rgba(244, 248, 252, 0)");
          ctx.fillStyle = sunGlow;
          ctx.fillRect(0, 0, width, height);

          // 3. Soft organic cirrus clouds in the distance
          const cloudPuffs = [
            { x: width * 0.12, y: height * 0.24, rx: 240, ry: 95, a: 0.55 },
            { x: width * 0.24, y: height * 0.18, rx: 300, ry: 115, a: 0.45 },
            { x: width * 0.82, y: height * 0.18, rx: 320, ry: 105, a: 0.50 },
            { x: width * 0.72, y: height * 0.28, rx: 250, ry: 85, a: 0.40 },
            { x: width * 0.15, y: height * 0.78, rx: 270, ry: 110, a: 0.45 },
            { x: width * 0.85, y: height * 0.75, rx: 310, ry: 125, a: 0.50 },
            { x: width * 0.50, y: height * 0.88, rx: 360, ry: 130, a: 0.40 }
          ];

          cloudPuffs.forEach(cloud => {
            ctx.save();
            ctx.translate(cloud.x, cloud.y);
            ctx.scale(1, cloud.ry / cloud.rx);
            const puff = ctx.createRadialGradient(0, 0, 0, 0, 0, cloud.rx);
            puff.addColorStop(0, `rgba(255, 255, 255, ${cloud.a})`);
            puff.addColorStop(0.5, `rgba(255, 255, 255, ${cloud.a * 0.45})`);
            puff.addColorStop(1, "rgba(255, 255, 255, 0)");
            ctx.fillStyle = puff;
            ctx.beginPath();
            ctx.arc(0, 0, cloud.rx, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          });

          // 4. Subtle daylight motes (sunlit dust particles in the air, identical concept to stars)
          const moteCount = Math.floor((width * height) / 5000);
          for (let i = 0; i < moteCount; i++) {
            const mx = Math.random() * width;
            const my = Math.random() * height;
            const mRadius = Math.random() < 0.85 ? (Math.random() * 0.7 + 0.4) : (Math.random() * 1.1 + 0.9);
            const isWarm = Math.random() < 0.20;
            const alpha = Math.random() * 0.30 + 0.12;
            ctx.fillStyle = isWarm
              ? `rgba(235, 175, 55, ${alpha})`
              : `rgba(60, 155, 235, ${alpha})`;
            ctx.beginPath();
            ctx.arc(mx, my, mRadius, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      window.addEventListener("resize", renderBackground, { passive: true });
      window.renderAtlasBackground = renderBackground;
      renderBackground();
    })();
    // Navigation Controller with Horizontal Micro-Spring
    const navContainer = document.getElementById("main-nav");
    const navPill = document.getElementById("nav-pill");
    const navItems = document.querySelectorAll(".nav-item");

    function updatePillPosition(targetItem, animateJelly = true) {
      if (!navContainer || !navPill || !targetItem) return;
      const containerRect = navContainer.getBoundingClientRect();
      const targetRect = targetItem.getBoundingClientRect();

      const left = targetRect.left - containerRect.left;
      const width = targetRect.width;

      navPill.style.left = left + "px";
      navPill.style.width = width + "px";

      if (animateJelly) {
        targetItem.classList.remove("has-shaken");
        void targetItem.offsetWidth;
        targetItem.classList.add("has-shaken");
      }
    }

    navItems.forEach(item => {
      item.addEventListener("click", () => {
        navItems.forEach(btn => {
          btn.classList.remove("is-active");
          btn.setAttribute("aria-selected", "false");
        });
        item.classList.add("is-active");
        item.setAttribute("aria-selected", "true");
        updatePillPosition(item, true);
      });
    });

    // Theme Switcher Controller
    const themeBtn = document.getElementById("theme-toggle");
    const moonIcon = document.getElementById("theme-icon-moon");
    const sunIcon = document.getElementById("theme-icon-sun");

    function setAppTheme(theme) {
      document.documentElement.dataset.theme = theme;
      if (theme === "light") {
        moonIcon.style.display = "none";
        sunIcon.style.display = "block";
      } else {
        moonIcon.style.display = "block";
        sunIcon.style.display = "none";
      }

      if (window.deyttMapAtlas) {
        window.deyttMapAtlas.markMapDirty();
        window.deyttMapAtlas.start();
      }

      if (window.renderAtlasBackground) {
        window.renderAtlasBackground();
      }
    }

    if (new URLSearchParams(window.location.search).get("theme") === "light") {
      setAppTheme("light");
    }

    if (themeBtn) {
      themeBtn.addEventListener("click", () => {
        const currentTheme = document.documentElement.dataset.theme || "dark";
        const newTheme = currentTheme === "dark" ? "light" : "dark";
        setAppTheme(newTheme);
      });
    }

    // Connect & Measure Button Simulation for preview
    let isConnected = false;
    const actionBtn = document.getElementById("home-action");
    if (actionBtn) {
      actionBtn.addEventListener("click", () => {
        const label = actionBtn.querySelector("[data-action-label]");
        const latency = document.getElementById("home-latency");
        const speed = document.getElementById("home-speed");
        const status = document.getElementById("home-status");

        if (!isConnected) {
          isConnected = true;
          if (label) label.textContent = "Отключиться";
          actionBtn.dataset.tone = "good";
          if (latency) latency.textContent = "24";
          if (speed) speed.textContent = "185";
          if (status) status.textContent = "подключено";
          if (window.deyttMapAtlas) {
            window.deyttMapAtlas.setTrafficActive(true);
            window.deyttMapAtlas.start();
          }
        } else {
          isConnected = false;
          if (label) label.textContent = "Подключиться";
          actionBtn.dataset.tone = "idle";
          if (latency) latency.textContent = "—";
          if (speed) speed.textContent = "—";
          if (status) status.textContent = "не подключено";
          if (window.deyttMapAtlas) {
            window.deyttMapAtlas.setTrafficActive(false);
            window.deyttMapAtlas.start();
          }
        }
      });
    }

    const measureBtn = document.getElementById("home-measure");
    if (measureBtn) {
      measureBtn.addEventListener("click", () => {
        const latency = document.getElementById("home-latency");
        const speed = document.getElementById("home-speed");
        if (latency) latency.textContent = "…";
        if (speed) speed.textContent = "…";
        setTimeout(() => {
          if (latency) latency.textContent = (Math.floor(Math.random() * 8) + 20).toString();
          if (speed) speed.textContent = (Math.floor(Math.random() * 30) + 180).toString();
        }, 350);
      });
    }

    window.addEventListener("DOMContentLoaded", () => {
      const activeTab = document.querySelector(".nav-item.is-active");
      if (activeTab) updatePillPosition(activeTab, false);
    });

    window.addEventListener("load", () => {
      const activeTab = document.querySelector(".nav-item.is-active");
      if (activeTab) updatePillPosition(activeTab, false);
    });

    window.addEventListener("resize", () => {
      const activeTab = document.querySelector(".nav-item.is-active");
      if (activeTab) updatePillPosition(activeTab, false);
    });
  </script>
</body>
</html>
