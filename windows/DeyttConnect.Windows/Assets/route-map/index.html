<!doctype html>
<html lang="ru" data-theme="dark" data-atlas-profile="windows">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>deytt. · подключение</title>
  <link rel="stylesheet" href="network-atlas.css?v=20261021_05">
  <script defer src="network-atlas.js?v=20261021_05"></script>
  <script defer src="atlas-init.js?v=20261021_05"></script>

  <style>
    :root {
      --header-bg: transparent;
      --header-border: transparent;
      --nav-bg: rgba(255, 255, 255, 0.025);
      --nav-border: rgba(255, 255, 255, 0.08);
      --nav-border-top: rgba(255, 255, 255, 0.20);
      --nav-border-bottom: rgba(0, 0, 0, 0.35);
      --nav-shadow: 0 12px 32px -4px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.10);
      --nav-pill-bg: linear-gradient(180deg, rgba(255, 255, 255, 0.09) 0%, rgba(255, 255, 255, 0.025) 100%);
      --nav-pill-border: rgba(255, 255, 255, 0.16);
      --nav-pill-border-top: rgba(255, 255, 255, 0.45);
      --nav-pill-border-bottom: rgba(0, 0, 0, 0.25);
      --nav-pill-shadow: 0 4px 16px -2px rgba(0, 0, 0, 0.35), inset 0 1px 0 0 rgba(255, 255, 255, 0.25);
      --text: #F8FAFC;
      --text-muted: #8E9EAF;
    }

    html[data-theme="light"] {
      --header-bg: transparent;
      --header-border: transparent;
      --nav-bg: rgba(255, 255, 255, 0.85);
      --nav-border: rgba(0, 0, 0, 0.08);
      --nav-border-top: rgba(255, 255, 255, 1);
      --nav-border-bottom: rgba(0, 0, 0, 0.10);
      --nav-shadow: inset 0 1px 2px 0 #FFFFFF, 0 6px 20px -2px rgba(0, 0, 0, 0.06);
      --nav-pill-bg: linear-gradient(180deg, #FFFFFF 0%, rgba(246, 249, 255, 0.96) 100%);
      --nav-pill-border: rgba(0, 0, 0, 0.10);
      --nav-pill-border-top: #FFFFFF;
      --nav-pill-border-bottom: rgba(0, 0, 0, 0.12);
      --nav-pill-shadow: 0 4px 14px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.04), inset 0 1px 1px #FFFFFF;
      --text: #0F172A;
      --text-muted: #5C6E82;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      user-select: none;
      position: relative;
    }

    html[data-theme="dark"] body {
      background: #0B111B;
      color: #F8FAFC;
    }

    html[data-theme="light"] body {
      background: #F4F7FB;
      color: #0F172A;
    }

    /* Floating Transparent Header on Stars */
    .desktop-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 68px;
      min-height: 68px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      background: transparent;
      border-bottom: none;
      box-shadow: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      z-index: 100;
      pointer-events: none;
    }

    .brand-area,
    .nav-container,
    .window-controls {
      pointer-events: auto;
    }

    .brand-area {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 160px;
    }

    .brand-logo {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--text);
      display: inline-flex;
      align-items: baseline;
    }

    .brand-dot {
      color: #38BDF8;
      font-size: 24px;
      line-height: 0;
    }

    /* Modern Glass Navigation Capsule Dock */
    .nav-container {
      position: relative;
      display: inline-flex;
      align-items: center;
      background: var(--nav-bg);
      border: 1px solid var(--nav-border);
      border-top-color: var(--nav-border-top);
      border-bottom-color: var(--nav-border-bottom);
      border-radius: 20px;
      padding: 6px;
      box-shadow: var(--nav-shadow);
      backdrop-filter: blur(24px) saturate(190%);
      -webkit-backdrop-filter: blur(24px) saturate(190%);
    }

    /* Clean Elevated Glass Pill */
    .nav-jelly-pill {
      position: absolute;
      top: 6px;
      left: 0;
      height: calc(100% - 12px);
      background: var(--nav-pill-bg);
      border: 1px solid var(--nav-pill-border);
      border-top-color: var(--nav-pill-border-top);
      border-bottom-color: var(--nav-pill-border-bottom);
      border-radius: 14px;
      box-shadow: var(--nav-pill-shadow);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      pointer-events: none;
      z-index: 1;
      transform-origin: center center;
      transition: left 240ms cubic-bezier(0.2, 0.9, 0.3, 1),
                  width 240ms cubic-bezier(0.2, 0.9, 0.3, 1);
    }

    .nav-item {
      position: relative;
      z-index: 2;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 14.5px;
      font-weight: 500;
      padding: 9px 24px;
      border-radius: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      transition: color 150ms ease, background 150ms ease;
    }

    .nav-item:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.05);
    }

    html[data-theme="light"] .nav-item:hover {
      background: rgba(0, 0, 0, 0.04);
      color: #0F172A;
    }

    .nav-item.is-active {
      color: #FFFFFF;
      font-weight: 600;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
    }

    html[data-theme="light"] .nav-item.is-active {
      color: #0F172A;
      text-shadow: none;
    }

    .nav-item svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @keyframes jelly-micro-spring {
      0% { transform: translateX(0); }
      40% { transform: translateX(0.35px); }
      75% { transform: translateX(-0.15px); }
      100% { transform: translateX(0); }
    }

    .nav-item.has-shaken .nav-label-wrap {
      animation: jelly-micro-spring 160ms cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      display: inline-flex;
      align-items: center;
      gap: 9px;
    }

    .window-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 160px;
      justify-content: flex-end;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 140ms ease;
    }

    .icon-btn:hover {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.04) 100%);
      color: var(--text);
      border-color: rgba(255, 255, 255, 0.22);
      border-top-color: rgba(255, 255, 255, 0.5);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4), 0 2px 8px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    html[data-theme="light"] .icon-btn:hover {
      background: linear-gradient(180deg, #FFFFFF 0%, rgba(245, 248, 255, 0.95) 100%);
      border-color: rgba(0, 0, 0, 0.1);
      border-top-color: #FFFFFF;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    .icon-btn svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .window-divider {
      width: 1px;
      height: 18px;
      background: rgba(255, 255, 255, 0.12);
      margin: 0 4px;
    }

    html[data-theme="light"] .window-divider {
      background: rgba(0, 0, 0, 0.10);
    }

    #stars-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      transform: translateZ(0);
      will-change: transform;
    }

    /* Viewport filling main container */
    .app-viewport {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 1;
    }

    .network-atlas {
      width: 100%;
      height: 100%;
    }

    .motion-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(30px);
      opacity: 0;
      pointer-events: none;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(8px);
      color: #FFFFFF;
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 500;
      transition: all 220ms cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 2000;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .motion-toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Ambient Background Style Switcher */
    .bg-variant-bar {
      position: fixed;
      bottom: 20px;
      left: 24px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 8px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(0, 0, 0, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
      transition: all 160ms ease;
    }

    html[data-theme="dark"] .bg-variant-bar {
      background: rgba(15, 23, 35, 0.72);
      border-color: rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }

    .bg-bar-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-right: 3px;
      padding-left: 4px;
    }

    .bg-pill-btn {
      border: none;
      background: transparent;
      padding: 4px 9px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 120ms ease;
      white-space: nowrap;
    }

    .bg-pill-btn:hover {
      color: var(--text);
      background: rgba(0, 0, 0, 0.05);
    }

    html[data-theme="dark"] .bg-pill-btn:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .bg-pill-btn.is-active {
      background: #FFFFFF;
      color: #0284C7;
      font-weight: 600;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
    }

    html[data-theme="dark"] .bg-pill-btn.is-active {
      background: rgba(255, 255, 255, 0.16);
      color: #38BDF8;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
    }
  </style>
</head>
<body>
  <!-- Desktop Header -->
  <header class="desktop-header">
    <div class="brand-area">
      <span class="brand-logo">deytt<span class="brand-dot">.</span></span>
    </div>

    <!-- Navigation with Horizontal Micro-Spring -->
    <nav class="nav-container" id="main-nav" role="tablist">
      <div class="nav-jelly-pill" id="nav-pill"></div>

      <button class="nav-item is-active" id="tab-home" data-tab="home" role="tab" aria-selected="true">
        <span class="nav-label-wrap">
          <svg viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1V9.5z"/></svg>
          <span>Главная</span>
        </span>
      </button>

      <button class="nav-item" id="tab-routes" data-tab="routes" role="tab" aria-selected="false">
        <span class="nav-label-wrap">
          <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
          <span>Маршруты</span>
        </span>
      </button>

      <button class="nav-item" id="tab-profile" data-tab="profile" role="tab" aria-selected="false">
        <span class="nav-label-wrap">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 1 0-16 0"/></svg>
          <span>Профиль</span>
        </span>
      </button>

      <button class="nav-item" id="tab-settings" data-tab="settings" role="tab" aria-selected="false">
        <span class="nav-label-wrap">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>Настройки</span>
        </span>
      </button>
    </nav>

    <!-- Controls -->
    <div class="window-controls">
      <button class="icon-btn" id="theme-toggle" title="Переключить тему (Тёмная / Светлая)" aria-label="Сменить тему">
        <svg id="theme-icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg id="theme-icon-sun" viewBox="0 0 24 24" style="display:none;"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
      <div class="window-divider"></div>
      <button class="icon-btn" title="Свернуть"><svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
      <button class="icon-btn" title="Развернуть"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></svg></button>
      <button class="icon-btn" title="Закрыть"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
  </header>

  <!-- Zero-overhead static starry sky -->
  <canvas id="stars-canvas"></canvas>

  <!-- Main Viewport with Interactive Globe & Original Right Panel -->
  <main class="app-viewport">
    <div class="network-atlas" data-atlas-status="loading" data-atlas-variant="home">
      <div class="home-scene">
        <div class="network-atlas__canvas-wrap">
          <canvas data-atlas-interactive tabindex="0" role="img" aria-label="интерактивный глобус маршрута deytt."></canvas>
          <span class="network-atlas__loader" data-atlas-status role="status" aria-live="polite">загружаю глобус</span>
          <span class="network-atlas__tooltip" data-atlas-tooltip role="status" aria-live="polite" hidden></span>
          <div class="traffic-hint" data-traffic-hint role="status" aria-live="polite" hidden></div>
          <div class="traffic-legend sr-only" data-traffic-legend aria-label="traffic colors">
            <button type="button" class="legend-upload" data-legend-upload data-flow="upload">исходящие данные</button>
            <button type="button" class="legend-download" data-legend-download data-flow="download">ответный трафик</button>
            <button type="button" class="legend-control" data-legend-control data-flow="control">служебный трафик</button>
          </div>
          <section class="traffic-inspector" data-traffic-inspector data-traffic-inspector-card role="region" aria-label="описание выбранного потока" hidden>
            <span class="traffic-inspector__eyebrow" data-inspector-kind></span>
            <h2 data-inspector-title></h2>
            <p class="traffic-inspector__path" data-inspector-path></p>
            <p data-inspector-body></p>
            <span class="traffic-inspector__item" data-inspector-item></span>
            <p class="traffic-inspector__note" data-inspector-note></p>
            <button type="button" data-inspector-resume>Показать все линии</button>
          </section>
        </div>

        <!-- Original Right Panel Shell from b41de7b -->
        <section class="home-panel-shell" aria-label="управление подключением">
          <div class="home-panel">
            <div class="panel-copy status-copy">
              <h1 id="home-status" class="sr-only" aria-live="polite">не подключено</h1>
              <p id="home-error" class="home-error" hidden></p>
            </div>
            <div class="panel-copy route-copy">
              <div class="route-heading">
                <span id="home-flag" class="route-flag" aria-hidden="true">🌐</span>
                <div class="route-labels">
                  <span id="home-country" class="home-country">автоподбор</span>
                  <strong id="home-city" class="home-city">выход выберется автоматически</strong>
                  <span id="home-protocol" class="home-protocol" hidden></span>
                </div>
              </div>
            </div>
            <button id="home-action" class="home-action panel-copy" type="button" data-action="home-connect">
              <span data-action-label>Подключиться</span>
              <span class="action-dots" aria-hidden="true"><i></i><i></i><i></i></span>
            </button>
            <div class="home-metrics panel-copy" aria-label="последний замер маршрута">
              <div class="metric">
                <span class="metric-label" id="latency-label">отклик</span>
                <strong id="home-latency">—</strong><small id="home-latency-unit">мс</small>
              </div>
              <div class="metric">
                <span class="metric-label" id="speed-label">скорость</span>
                <strong id="home-speed">—</strong><small id="home-speed-unit">Мбит/с</small>
              </div>
            </div>
            <p id="home-measurement-note" class="measurement-note panel-copy" hidden></p>
            <button id="home-measure" class="home-measure" type="button" data-action="home-measure">обновить замер</button>
            <p id="home-route-description" class="sr-only" aria-live="polite"></p>
          </div>
        </section>

        <!-- Original Compact view fallback -->
        <section class="home-compact" aria-label="текущее подключение" aria-hidden="true" inert>
          <div class="home-compact-content">
            <div class="compact-summary">
              <div class="compact-status-line sr-only">
                <span class="compact-status-dot" aria-hidden="true"></span>
                <span id="compact-status" class="compact-status" data-tone="normal">не подключено</span>
              </div>
              <div class="compact-route">
                <span id="compact-flag" class="route-flag" aria-hidden="true">🌐</span>
                <div class="route-labels">
                  <span id="compact-country" class="home-country">автоподбор</span>
                  <strong id="compact-city" class="home-city">выход выберется автоматически</strong>
                  <span id="compact-protocol" class="home-protocol" hidden></span>
                </div>
              </div>
            </div>
            <button id="compact-action" class="compact-action" type="button" data-action="home-connect"><span data-action-label>Подключиться</span><span class="action-dots" aria-hidden="true"><i></i><i></i><i></i></span></button>
            <button id="immersive-exit" class="compact-exit" type="button" aria-label="вернуться к окну" title="вернуться к окну · esc" hidden>↙</button>
            <p id="compact-error" class="compact-error" role="status" hidden></p>
            <div class="compact-metrics"><span id="compact-latency">— мс</span><span id="compact-speed">— Мбит/с</span></div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <!-- Light Theme Ambient Background Variant Switcher -->
  <nav class="bg-variant-bar" id="bg-variant-bar" aria-label="Варианты фона">
    <span class="bg-bar-title">Фон:</span>
    <button type="button" class="bg-pill-btn is-active" data-bg="studio" title="Мягкий студийный свет (Apple / Fluent ambient)">1. Студия</button>
    <button type="button" class="bg-pill-btn" data-bg="stardust" title="Дневные звезды и спутниковые маяки">2. Звезды дня</button>
    <button type="button" class="bg-pill-btn" data-bg="strato" title="Высотный горизонт / Стратосфера">3. Горизонт</button>
    <button type="button" class="bg-pill-btn" data-bg="minimal" title="Чистый фарфоровый минимализм">4. Минимал</button>
  </nav>

  <div class="motion-toast" id="toast"></div>

  <script>
    // Zero-overhead static background canvas (renders once, 0% CPU overhead while spinning globe)
    (function initBackgroundCanvas() {
      const canvas = document.getElementById("stars-canvas");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");

      // Active background variant for light theme (persisted in localStorage or query param)
      const urlBg = new URLSearchParams(window.location.search).get("bg");
      window.currentBgVariant = urlBg || localStorage.getItem("deytt_light_bg") || "studio";

      function updateBgPickerUI() {
        const btns = document.querySelectorAll(".bg-pill-btn");
        btns.forEach(b => {
          const match = b.dataset.bg === window.currentBgVariant;
          b.classList.toggle("is-active", match);
          b.setAttribute("aria-pressed", match ? "true" : "false");
        });
      }

      function renderBackground() {
        const dpr = Math.min(2, window.devicePixelRatio || 1);
        const width = window.innerWidth;
        const height = window.innerHeight;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.scale(dpr, dpr);
        ctx.clearRect(0, 0, width, height);

        const isLight = document.documentElement.dataset.theme === "light";

        if (!isLight) {
          // Dark Theme: Deep Space Starry Sky
          const count = Math.floor((width * height) / 3200);
          for (let i = 0; i < count; i++) {
            const x = Math.random() * width;
            const y = Math.random() * height;
            const radius = Math.random() < 0.85 ? (Math.random() * 0.7 + 0.3) : (Math.random() * 1.1 + 0.8);
            const alpha = Math.random() * 0.65 + 0.25;
            ctx.fillStyle = `rgba(235, 245, 255, ${alpha})`;
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fill();
          }
          return;
        }

        // ==========================================
        // Light Theme: 4 Premium, Professional Variants
        // ==========================================
        const activeVariant = window.currentBgVariant || "studio";
        const globeCx = width * 0.44;
        const globeCy = height * 0.50;
        const globeR = Math.min(width, height) * 0.48;

        if (activeVariant === "studio") {
          // ------------------------------------------
          // ВАРИАНТ 1: Мягкий студийный свет (Apple / Fluent ambient) [DEFAULT]
          // ------------------------------------------
          // 1. Serene porcelain-sky gradient
          const baseGrad = ctx.createLinearGradient(0, 0, width, height);
          baseGrad.addColorStop(0, "#EBF3FA");
          baseGrad.addColorStop(0.45, "#F3F7FA");
          baseGrad.addColorStop(1, "#F7FAFC");
          ctx.fillStyle = baseGrad;
          ctx.fillRect(0, 0, width, height);

          // 2. Soft, luminous solar aura directly behind the globe
          const haloGrad = ctx.createRadialGradient(globeCx, globeCy, globeR * 0.2, globeCx, globeCy, globeR * 1.45);
          haloGrad.addColorStop(0, "rgba(185, 218, 248, 0.42)");
          haloGrad.addColorStop(0.35, "rgba(210, 232, 252, 0.22)");
          haloGrad.addColorStop(0.70, "rgba(235, 245, 255, 0.08)");
          haloGrad.addColorStop(1, "rgba(247, 250, 252, 0)");
          ctx.fillStyle = haloGrad;
          ctx.beginPath();
          ctx.arc(globeCx, globeCy, globeR * 1.45, 0, Math.PI * 2);
          ctx.fill();

          // 3. Gentle morning sun warmth in top-left
          const sunWarmth = ctx.createRadialGradient(width * 0.12, height * 0.08, 10, width * 0.12, height * 0.08, width * 0.65);
          sunWarmth.addColorStop(0, "rgba(255, 246, 230, 0.45)");
          sunWarmth.addColorStop(0.45, "rgba(255, 250, 242, 0.18)");
          sunWarmth.addColorStop(1, "rgba(255, 255, 255, 0)");
          ctx.fillStyle = sunWarmth;
          ctx.fillRect(0, 0, width, height);

          // 4. Subtle daylight dust particles floating peacefully in the light
          const moteCount = 38;
          for (let i = 0; i < moteCount; i++) {
            const mx = Math.random() * width;
            const my = Math.random() * height;
            const mr = Math.random() * 0.6 + 0.6; // 0.6px - 1.2px
            const alpha = Math.random() * 0.15 + 0.12;
            ctx.fillStyle = `rgba(18, 85, 145, ${alpha})`;
            ctx.beginPath();
            ctx.arc(mx, my, mr, 0, Math.PI * 2);
            ctx.fill();
          }

        } else if (activeVariant === "stardust") {
          // ------------------------------------------
          // ВАРИАНТ 2: Дневные звезды / Спутниковые маяки (Daylight Star-Dust)
          // ------------------------------------------
          // 1. Clear sky gradient
          const skyGrad = ctx.createLinearGradient(0, 0, 0, height);
          skyGrad.addColorStop(0, "#E2EEF8");
          skyGrad.addColorStop(0.5, "#EEF5FB");
          skyGrad.addColorStop(1, "#F6F9FC");
          ctx.fillStyle = skyGrad;
          ctx.fillRect(0, 0, width, height);

          // 2. Halo behind globe
          const halo = ctx.createRadialGradient(globeCx, globeCy, 40, globeCx, globeCy, globeR * 1.35);
          halo.addColorStop(0, "rgba(195, 225, 250, 0.45)");
          halo.addColorStop(0.6, "rgba(225, 240, 255, 0.15)");
          halo.addColorStop(1, "rgba(246, 249, 252, 0)");
          ctx.fillStyle = halo;
          ctx.fillRect(0, 0, width, height);

          // 3. Crisp daytime micro-stars (exact conceptual twin of dark theme stars!)
          const count = Math.floor((width * height) / 3600);
          for (let i = 0; i < count; i++) {
            const x = Math.random() * width;
            const y = Math.random() * height;
            const isLarge = Math.random() < 0.20;
            const radius = isLarge ? (Math.random() * 0.4 + 1.0) : (Math.random() * 0.4 + 0.5);
            const isGold = Math.random() < 0.22;
            const alpha = Math.random() * 0.32 + 0.18;
            ctx.fillStyle = isGold
              ? `rgba(217, 119, 6, ${alpha})`
              : `rgba(2, 132, 199, ${alpha})`;
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fill();
          }

        } else if (activeVariant === "strato") {
          // ------------------------------------------
          // ВАРИАНТ 3: Высотный горизонт / Стратосфера
          // ------------------------------------------
          const stratoGrad = ctx.createLinearGradient(0, 0, 0, height);
          stratoGrad.addColorStop(0, "#CDE4F7");
          stratoGrad.addColorStop(0.38, "#E2F0FA");
          stratoGrad.addColorStop(0.70, "#EFF6FB");
          stratoGrad.addColorStop(1, "#F7FAFC");
          ctx.fillStyle = stratoGrad;
          ctx.fillRect(0, 0, width, height);

          // Soft diffuse horizontal horizon haze
          const hazeGrad = ctx.createLinearGradient(0, height * 0.45, 0, height * 0.65);
          hazeGrad.addColorStop(0, "rgba(255, 255, 255, 0)");
          hazeGrad.addColorStop(0.5, "rgba(255, 255, 255, 0.45)");
          hazeGrad.addColorStop(1, "rgba(255, 255, 255, 0)");
          ctx.fillStyle = hazeGrad;
          ctx.fillRect(0, height * 0.45, width, height * 0.20);

          // Solar glow
          const sun = ctx.createRadialGradient(width * 0.15, height * 0.10, 20, width * 0.15, height * 0.10, width * 0.5);
          sun.addColorStop(0, "rgba(255, 250, 240, 0.55)");
          sun.addColorStop(0.5, "rgba(240, 248, 255, 0.2)");
          sun.addColorStop(1, "rgba(255, 255, 255, 0)");
          ctx.fillStyle = sun;
          ctx.fillRect(0, 0, width, height);

        } else if (activeVariant === "minimal") {
          // ------------------------------------------
          // ВАРИАНТ 4: Чистый фарфоровый минимализм
          // ------------------------------------------
          ctx.fillStyle = "#F4F8FC";
          ctx.fillRect(0, 0, width, height);

          // Ultra-subtle vignette
          const vign = ctx.createRadialGradient(width * 0.5, height * 0.5, Math.min(width, height) * 0.4, width * 0.5, height * 0.5, Math.max(width, height) * 0.8);
          vign.addColorStop(0, "rgba(244, 248, 252, 0)");
          vign.addColorStop(1, "rgba(215, 228, 240, 0.25)");
          ctx.fillStyle = vign;
          ctx.fillRect(0, 0, width, height);
        }
      }

      // Hook switcher click handlers
      const bgBar = document.getElementById("bg-variant-bar");
      if (bgBar) {
        bgBar.addEventListener("click", (e) => {
          const btn = e.target.closest(".bg-pill-btn");
          if (!btn) return;
          const bgKey = btn.dataset.bg;
          if (!bgKey) return;
          window.currentBgVariant = bgKey;
          localStorage.setItem("deytt_light_bg", bgKey);
          updateBgPickerUI();
          renderBackground();
        });
      }

      window.addEventListener("resize", renderBackground, { passive: true });
      window.renderAtlasBackground = renderBackground;
      window.updateBgPickerUI = updateBgPickerUI;
      updateBgPickerUI();
      renderBackground();
    })();
    // Navigation Controller with Horizontal Micro-Spring
    const navContainer = document.getElementById("main-nav");
    const navPill = document.getElementById("nav-pill");
    const navItems = document.querySelectorAll(".nav-item");

    function updatePillPosition(targetItem, animateJelly = true) {
      if (!navContainer || !navPill || !targetItem) return;
      const containerRect = navContainer.getBoundingClientRect();
      const targetRect = targetItem.getBoundingClientRect();

      const left = targetRect.left - containerRect.left;
      const width = targetRect.width;

      navPill.style.left = left + "px";
      navPill.style.width = width + "px";

      if (animateJelly) {
        targetItem.classList.remove("has-shaken");
        void targetItem.offsetWidth;
        targetItem.classList.add("has-shaken");
      }
    }

    navItems.forEach(item => {
      item.addEventListener("click", () => {
        navItems.forEach(btn => {
          btn.classList.remove("is-active");
          btn.setAttribute("aria-selected", "false");
        });
        item.classList.add("is-active");
        item.setAttribute("aria-selected", "true");
        updatePillPosition(item, true);
      });
    });

    // Theme Switcher Controller
    const themeBtn = document.getElementById("theme-toggle");
    const moonIcon = document.getElementById("theme-icon-moon");
    const sunIcon = document.getElementById("theme-icon-sun");

    function setAppTheme(theme) {
      document.documentElement.dataset.theme = theme;
      if (theme === "light") {
        moonIcon.style.display = "none";
        sunIcon.style.display = "block";
      } else {
        moonIcon.style.display = "block";
        sunIcon.style.display = "none";
      }

      if (window.deyttMapAtlas) {
        window.deyttMapAtlas.markMapDirty();
        window.deyttMapAtlas.start();
      }

      if (window.renderAtlasBackground) {
        window.renderAtlasBackground();
      }
      if (window.updateBgPickerUI) {
        window.updateBgPickerUI();
      }
    }

    if (new URLSearchParams(window.location.search).get("theme") === "light") {
      setAppTheme("light");
    }

    if (themeBtn) {
      themeBtn.addEventListener("click", () => {
        const currentTheme = document.documentElement.dataset.theme || "dark";
        const newTheme = currentTheme === "dark" ? "light" : "dark";
        setAppTheme(newTheme);
      });
    }

    // Connect & Measure Button Simulation for preview
    let isConnected = false;
    const actionBtn = document.getElementById("home-action");
    if (actionBtn) {
      actionBtn.addEventListener("click", () => {
        const label = actionBtn.querySelector("[data-action-label]");
        const latency = document.getElementById("home-latency");
        const speed = document.getElementById("home-speed");
        const status = document.getElementById("home-status");

        if (!isConnected) {
          isConnected = true;
          if (label) label.textContent = "Отключиться";
          actionBtn.dataset.tone = "good";
          if (latency) latency.textContent = "24";
          if (speed) speed.textContent = "185";
          if (status) status.textContent = "подключено";
          if (window.deyttMapAtlas) {
            window.deyttMapAtlas.setTrafficActive(true);
            window.deyttMapAtlas.start();
          }
        } else {
          isConnected = false;
          if (label) label.textContent = "Подключиться";
          actionBtn.dataset.tone = "idle";
          if (latency) latency.textContent = "—";
          if (speed) speed.textContent = "—";
          if (status) status.textContent = "не подключено";
          if (window.deyttMapAtlas) {
            window.deyttMapAtlas.setTrafficActive(false);
            window.deyttMapAtlas.start();
          }
        }
      });
    }

    const measureBtn = document.getElementById("home-measure");
    if (measureBtn) {
      measureBtn.addEventListener("click", () => {
        const latency = document.getElementById("home-latency");
        const speed = document.getElementById("home-speed");
        if (latency) latency.textContent = "…";
        if (speed) speed.textContent = "…";
        setTimeout(() => {
          if (latency) latency.textContent = (Math.floor(Math.random() * 8) + 20).toString();
          if (speed) speed.textContent = (Math.floor(Math.random() * 30) + 180).toString();
        }, 350);
      });
    }

    window.addEventListener("DOMContentLoaded", () => {
      const activeTab = document.querySelector(".nav-item.is-active");
      if (activeTab) updatePillPosition(activeTab, false);
    });

    window.addEventListener("load", () => {
      const activeTab = document.querySelector(".nav-item.is-active");
      if (activeTab) updatePillPosition(activeTab, false);
    });

    window.addEventListener("resize", () => {
      const activeTab = document.querySelector(".nav-item.is-active");
      if (activeTab) updatePillPosition(activeTab, false);
    });
  </script>
</body>
</html>
